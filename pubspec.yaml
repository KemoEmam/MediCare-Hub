name: medi_care_hub
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a `+`.
version: 1.0.0+1

environment:
  sdk: '>=3.5.2 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  forbidden_pack:
    git:
      url: https://github.com/KemoEmam/ForbiddenPack.git
      ref: main
  go_router: ^14.2.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Medium.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Medium.ttf

    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Light.ttf

    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Medium.ttf

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/themes/styles
  filename: app_images.dart
  classname: AppImages
  field_prefix: ''
